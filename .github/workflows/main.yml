name: CI

on:
  push:

jobs:
  test:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout code
           uses: actions/checkout@v4
           
         - name: Set up Python
           uses: actions/setup-python@v5
           with:
              python-version: "3.11"

         - name: Install dependencies
           run: pip install -r tiny-ai-agent/requirements.txt     
 
         - name: Lint
           run: pip install ruff && ruff check tiny-ai-agent --fix

         - name: Test
           run: python -c "print('CI test passed')"
           
         - name: Build Docker image
           run: docker build -t tiny-ai-agent ./tiny-ai-agent

     
